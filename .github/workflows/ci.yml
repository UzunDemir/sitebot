name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (typecheck + Next build)
        run: npm run build
      - name: Local smoke (chunker, vector literal, env guard)
        run: npx tsx scripts/smoke-local.ts
